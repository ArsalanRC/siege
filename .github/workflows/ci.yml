name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      # standalone, because pnpm 11 needs Node >= 22.13 while this package
      # supports 18. Without it the matrix fails on 18 and 20, and the tempting
      # fix of dropping them turns the matrix into a test of what pnpm runs on
      # rather than what the physics runs on.
      #
      # No `version:` here on purpose: with `packageManager` in package.json the
      # action errors out rather than choosing between the two.
      - uses: pnpm/action-setup@v4
        with:
          standalone: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
